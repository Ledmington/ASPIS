name: ASPIS main CI

env:
  LLVM_VERSION: 21
  LLVM_INSTALL_DIR: /opt/llvm-21
  CMAKE_VERSION: 4.3.0
  MOLD_LINKER_FLAGS: -fuse-ld=mold
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 10G
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: "true"

on: [push]

jobs:
  compile-ASPIS:
    runs-on: ubuntu-latest
    container:
      image: docker.io/ledmington/aspis-deps:llvm21

    steps:
      - name: Checking out ASPIS
        uses: actions/checkout@v4
        with:
          path: ASPIS
          submodules: recursive
          fetch-depth: 0

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-llvm${{ env.LLVM_VERSION }}-${{ env.CMAKE_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-llvm${{ env.LLVM_VERSION }}-${{ env.CMAKE_VERSION }}-
            ccache-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ env.CMAKE_VERSION }}-

      - name: Compiling ASPIS
        shell: bash
        working-directory: ${{ github.workspace }}/ASPIS
        run: |
          ccache --set-config=max_size=${CCACHE_MAXSIZE}
          ccache --zero-stats
          ccache --show-config
          ccache --show-stats

          mkdir build
          cmake -B build -DLLVM_DIR=${{ env.LLVM_INSTALL_DIR }}/lib/cmake/llvm/
          cmake --build build

      - name: Save ccache
        if: steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-llvm${{ env.LLVM_VERSION }}-${{ env.CMAKE_VERSION }}-${{ github.sha }}

      - name: Cache pip
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('${{ github.workspace }}/ASPIS/testing/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install Python requirements
        shell: bash
        if: steps.restore-ccache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/ASPIS/testing
        run: |
           pip install -r requirements.txt

      - name: Testing ASPIS
        shell: bash
        working-directory: ${{ github.workspace }}/ASPIS/testing
        run: |
           pytest test.py --no-header -v

      - name: Upload comparison counter artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-counter
          path: ${{ github.workspace }}/ASPIS/testing/build/comparison_counter.csv
          if-no-files-found: warn

      - name: Upload failed test IR artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-out-ll
          path: |
            ASPIS/testing/failed-out-ll/**
          if-no-files-found: warn
